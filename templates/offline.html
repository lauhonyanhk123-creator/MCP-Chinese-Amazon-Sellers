{% extends "base.html" %}

{% block title %}{{ get_text('offline_title') }}{% endblock %}

{% block content %}
<div class="flex items-center justify-center min-h-[60vh]">
    <div class="text-center max-w-md mx-auto">
        <div class="w-24 h-24 mx-auto mb-6 bg-gray-100 rounded-full flex items-center justify-center">
            <svg class="w-12 h-12 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M18.364 5.636a9 9 0 010 12.728m0 0l-2.829-2.829m2.829 2.829L21 21M15.536 8.464a5 5 0 010 7.072m0 0l-2.829-2.829m-4.243 2.829a4.978 4.978 0 01-1.414-2.83m-1.414 5.658a9 9 0 01-2.167-9.238m7.824 2.167a1 1 0 111.414 1.414m-1.414-1.414L3 3m8.293 8.293l1.414 1.414"></path>
            </svg>
        </div>

        <h1 class="text-3xl font-bold text-gray-900 mb-4">{{ get_text('offline_title') }}</h1>
        <p class="text-gray-600 mb-8">{{ get_text('offline_desc') }}</p>

        <div id="cached-data-section" class="hidden mb-8 p-4 bg-green-50 border border-green-200 rounded-lg">
            <div class="flex items-center justify-center mb-2">
                <svg class="w-5 h-5 text-green-600 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"></path>
                </svg>
                <span class="text-green-800 font-medium">{{ get_text('cached_data_available') }}</span>
            </div>
            <div id="cached-data-list" class="text-sm text-green-700 text-left mt-2"></div>
        </div>

        <button onclick="retryConnection()" class="inline-flex items-center px-6 py-3 bg-purple-600 text-white font-medium rounded-lg hover:bg-purple-700 transition-colors">
            <svg class="w-5 h-5 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path>
            </svg>
            {{ get_text('try_again') }}
        </button>

        <div class="mt-6 text-sm text-gray-500">
            <a href="/dashboard?lang={{ lang }}" class="text-purple-600 hover:text-purple-800">{{ get_text('go_to_dashboard') }}</a>
        </div>
    </div>
</div>

<script>
async function loadCachedData() {
    if ('serviceWorker' in navigator && navigator.serviceWorker.controller) {
        const channel = new MessageChannel();
        const responsePromise = new Promise((resolve) => {
            channel.port1.onmessage = (event) => resolve(event.data);
        });

        navigator.serviceWorker.controller.postMessage(
            { type: 'GET_CACHED_DATA' },
            [channel.port2]
        );

        const cachedData = await responsePromise;

        if (cachedData && cachedData.length > 0) {
            const section = document.getElementById('cached-data-section');
            const list = document.getElementById('cached-data-list');
            section.classList.remove('hidden');

            let html = '<ul class="space-y-1">';
            cachedData.forEach((item) => {
                const url = new URL(item.url);
                const endpoint = url.pathname.replace('/api/', '');
                html += `<li>• ${endpoint || 'data'}</li>`;
            });
            html += '</ul>';
            list.innerHTML = html;
        }
    }
}

function retryConnection() {
    if (navigator.onLine) {
        window.location.reload();
    } else {
        window.location.href = '/dashboard?lang={{ lang }}';
    }
}

loadCachedData();

setInterval(() => {
    if (navigator.onLine) {
        window.location.reload();
    }
}, 10000);
</script>
{% endblock %}
