line-length = 100
indent-width = 4

target-version = "py310"

[lint]
select = [
    "F",      # Pyflakes
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "I",      # isort
    "UP",     # pyupgrade
    "B",      # flake8-bugbear
    "C4",     # flake8-comprehensions
    "PL",     # pylint
    "RET",    # flake8-return
    "SIM",    # flake8-simplify
    "TCH",    # flake8-type-checking
    "RUF",    # Ruff-specific rules
]
ignore = [
    "PLR0913",  # Too many arguments
    "PLR2004",  # Magic value comparison
    "B008",     # Do not perform function calls in argument defaults
    "RET505",   # Unnecessary else after return
]

[lint.per-file-ignores]
"__init__.py" = ["F401"]
"test_*.py" = ["PLR2004", "B008"]
"e2e_tests/**/*.py" = ["PLR2004", "B008"]

[lint.isort]
known-first-party = ["src"]
combine-as-imports = true
force-single-line = false

[lint.pyupgrade]
keep-device = false
keep-array-like = false

[lint.pycodestyle]
max-line-length = 100
ignore-nested-sessions = true

[lint.pylint]
max-args = 8
max-returns = 6
max-branches = 12
max-locals = 15
max-statements = 50
