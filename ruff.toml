line-length = 100
indent-width = 4
target-version = "py310"

[lint]
select = [
    "F",      # Pyflakes
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "I",      # isort
    "UP",     # pyupgrade
    "B",      # flake8-bugbear
    "C4",     # flake8-comprehensions
    "RET",    # flake8-return
    "SIM",    # flake8-simplify
]
ignore = [
    "E501",     # Line too long (handled by formatter)
    "E722",     # Bare except (common in this codebase)
    "RUF001",   # Fullwidth characters (Chinese text)
    "F841",     # Unused variables (session reads, etc.)
]

[lint.per-file-ignores]
"__init__.py" = ["F401"]
"test_*.py" = ["F841"]
"tests/**/*.py" = ["F841"]
