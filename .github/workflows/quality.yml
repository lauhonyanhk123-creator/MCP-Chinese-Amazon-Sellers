name: Code Quality

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Cache pip dependencies
      uses: actions/cache@v4
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-quality-${{ hashFiles('requirements.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-quality-

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install ruff black isort bandit

    - name: Run Ruff linter
      run: |
        ruff check .
      continue-on-error: true

    - name: Run Black formatter check
      run: |
        black --check --diff .
      continue-on-error: true

    - name: Run isort import check
      run: |
        isort --check-only --diff .
      continue-on-error: true

    - name: Run Bandit security scan
      run: |
        bandit -r . -f json -o bandit-report.json
      continue-on-error: true

    - name: Upload Bandit report
      uses: actions/upload-artifact@v4
      with:
        name: bandit-report
        path: bandit-report.json
        retention-days: 7

  lint-strict:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install Ruff
      run: pip install ruff>=0.1.0

    - name: Run Ruff with strict rules
      run: ruff check . --output-format=github

    - name: Check code formatting
      run: |
        pip install black>=23.0.0
        black --check . || true
        pip install isort>=5.12.0
        isort --check-only . || true

  quality-gate:
    runs-on: ubuntu-latest
    needs: [lint, lint-strict]
    if: always()
    steps:
    - name: Check if all quality checks passed
      run: |
        if [[ "${{ needs.lint.result }}" == "failure" ]] || [[ "${{ needs.lint-strict.result }}" == "failure" ]]; then
          echo "Quality checks failed"
          exit 1
        fi
        echo "All quality checks passed"
