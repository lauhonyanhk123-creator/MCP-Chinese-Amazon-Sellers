name: Quick Check

on:
  push:
    branches: [ main, master, develop ]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.gitignore'
      - 'LICENSE'

jobs:
  quick-check:
    runs-on: ubuntu-latest
    timeout-minutes: 2

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Quick dependency check
      run: |
        python -m pip install --upgrade pip
        pip install -q pytest pytest-asyncio httpx
        pip install -q -r requirements.txt

    - name: Run fast smoke tests
      run: |
        pytest test_server.py -v --tb=short -x -q
      env:
        LICENSE_KEY: BUSINESS_DEMO_88888
        TESTING: true

    - name: Quick lint check
      run: |
        pip install -q ruff>=0.1.0
        ruff check . --select=F,E --quiet || true

    - name: Syntax check Python files
      run: |
        python -m py_compile *.py 2>&1 | head -20 || true
